<div class="contentImports">
  <div class="blockImports">
    <div class="imports-heading">
      <span class="heading-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3.75 6.75A1.75 1.75 0 0 1 5.5 5h4l2 2h7A1.75 1.75 0 0 1 20.25 8.75v9.5A1.75 1.75 0 0 1 18.5 20h-13a1.75 1.75 0 0 1-1.75-1.75v-11.5Z" />
          <path d="M4 9h16" />
        </svg>
      </span>
      <h2>Importar piezas</h2>
      <p>Sube un archivo Excel para actualizar el catálogo</p>
    </div>

    <label class="file-picker" for="components-file">
      <span class="folder-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M5 13.5A3.5 3.5 0 0 1 8.5 10h10l4 4H39.5a3.5 3.5 0 0 1 3.5 3.5v17a3.5 3.5 0 0 1-3.5 3.5h-31A3.5 3.5 0 0 1 5 34.5v-21Z" />
          <path d="M5 20h38" />
        </svg>
      </span>
      <strong>{{ selectedFile()?.name || 'Selecciona un archivo Excel' }}</strong>
      <span class="file-hint">Formato .xlsx</span>
      <input id="components-file" type="file" accept=".xlsx" (change)="selectFile($event)" />
    </label>

    <div class="actions">
      <button class="import-button" (click)="importFile()" [disabled]="!selectedFile() || isLoading()">
        {{ isLoading() ? 'Importando...' : 'Importar archivo' }}
      </button>
      <button class="export-button" (click)="exportExcel()">Exportar a Excel</button>
    </div>

    @if (message()) {
      <p class="ok" role="status">{{ message() }}</p>
    }
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </div>
</div>
